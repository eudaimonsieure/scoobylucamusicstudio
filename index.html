<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scooby Luca | Bon Jovi Collection</title>

<style>
:root {
    --bg: #101114;
    --card: #1b1d22;
    --gold: #d6b36a;
    --text: #f5f5f5;
    --muted: #a5a5a5;
    --border: #34363d;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px 50px;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

header {
    text-align: center;
    padding: 30px 10px;
}

header h1 {
    margin: 0;
    color: var(--gold);
    font-size: 34px;
    letter-spacing: 5px;
}

header h2 {
    margin: 12px 0 8px;
    font-size: 21px;
    letter-spacing: 3px;
}

header p {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 2px;
}

.search-box {
    margin: 20px 0;
}

.search-box input {
    width: 100%;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--card);
    color: white;
    font-size: 15px;
}

.search-box input:focus {
    border-color: var(--gold);
}

.track-count {
    color: var(--muted);
    margin: 15px 3px;
    font-size: 13px;
}

.track-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
}

.track-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.track-name {
    font-size: 16px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.track-type {
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 10px;
    white-space: nowrap;
}

audio {
    display: block;
    width: 100%;
    height: 42px;
    margin: 10px 0;
}

.track-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.file-size {
    color: var(--muted);
    font-size: 12px;
}

.download-btn {
    display: inline-block;
    padding: 9px 15px;
    border-radius: 7px;
    background: var(--gold);
    color: #151515;
    font-weight: bold;
    font-size: 12px;
    text-decoration: none;
}

.download-btn:hover {
    background: #f0cd82;
}

.status {
    color: #e2a2a2;
    font-size: 12px;
    margin-top: 8px;
}

.empty {
    display: none;
    padding: 30px;
    text-align: center;
    color: var(--muted);
}

footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    padding: 30px 10px;
    letter-spacing: 1px;
}

@media (max-width: 500px) {
    header h1 {
        font-size: 26px;
    }

    header h2 {
        font-size: 17px;
    }

    .track-card {
        padding: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>SCOOBY LUCA</h1>
    <h2>BON JOVI COLLECTION</h2>
    <p>CLASSIC ROCK · MUSIC · BACKING TRACKS</p>
</header>

<div class="search-box">
    <input
        type="search"
        id="searchInput"
        placeholder="Search songs..."
        autocomplete="off"
    >
</div>
<audio controls preload="metadata">
  <source
    src="https://raw.githubusercontent.com/eudaimonsieure/scoobylucamusicstudio/bon-jovi/01-Breathe-Demo.mp3"
    type="audio/mpeg">
  Your browser does not support audio playback.
</audio>
<div class="track-count" id="trackCount"></div>

<div id="playlist"></div>

<div class="empty" id="emptyMessage">
    No tracks found.
</div>

<footer>
    SCOOBY LUCA · BON JOVI MUSIC COLLECTION
</footer>

</div>

<script>
/* =================================
   AUDIO FILE LOCATION
================================= */

const AUDIO_BASE =
    "https://eudaimonsieure.github.io/scoobylucamusicstudio/bon-jovi/";


/* =================================
   TRACK DATABASE
================================= */

const tracks = [
    "01-Breathe-Demo.mp3",
    "01-Breathe-Demo-Instrumental.mp3",

    "02-Lucky-Demo.mp3",
    "02-Lucky-Demo-Instrumental.mp3",

    "03-No-Regrets-Demo.mp3",
    "03-No-Regrets-Demo-Instrumental.mp3",

    "04-Standing-Demo.mp3",
    "04-Standing-Demo-Instrumental.mp3",

    "05-We-Can-Dance-Demo.mp3",
    "05-We-Can-Dance-Demo-Instrumental.mp3",

    "06-Misunderstood-Live.mp3",
    "06-Misunderstood-Live-Instrumental.mp3",

    "07-Everyday-Acoustic.mp3",
    "07-Everyday-Acoustic-Instrumental.mp3",

    "08-Just-Older-Live.mp3",
    "08-Just-Older-Live-Instrumental.mp3"
];


/* =================================
   BUILD AUDIO URL
================================= */

function getAudioURL(file) {
    return AUDIO_BASE +
        file.split("/")
            .map(part => encodeURIComponent(part))
            .join("/");
}


/* =================================
   FORMAT FILE SIZE
================================= */

function formatFileSize(bytes) {
    if (!Number.isFinite(bytes) || bytes <= 0) {
        return "Size unavailable";
    }

    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + " KB";
    }

    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}


/* =================================
   GET FILE SIZE

   GitHub Pages may not expose
   Content-Length on HEAD requests.
================================= */

async function getFileSize(url, element) {
    try {
        const response = await fetch(url, {
            method: "HEAD"
        });

        if (!response.ok) {
            throw new Error("File unavailable");
        }

        const size = response.headers.get("content-length");

        if (size) {
            element.textContent =
                formatFileSize(Number(size));
        } else {
            element.textContent = "Size unavailable";
        }

    } catch (error) {
        element.textContent = "Size unavailable";
    }
}


/* =================================
   DETECT TRACK TYPE
================================= */

function getTrackType(file) {
    if (file.toLowerCase().includes("instrumental")) {
        return "INSTRUMENTAL";
    }

    if (file.toLowerCase().includes("acoustic")) {
        return "ACOUSTIC";
    }

    if (file.toLowerCase().includes("live")) {
        return "LIVE";
    }

    if (file.toLowerCase().includes("demo")) {
        return "DEMO";
    }

    return "AUDIO";
}


/* =================================
   FORMAT SONG TITLE
================================= */

function getTrackTitle(file) {
    return file
        .replace(/\.mp3$/i, "")
        .replace(/^\d+-/, "")
        .replace(/-Instrumental$/i, "")
        .replace(/-/g, " ");
}


/* =================================
   DOWNLOAD TRACK
================================= */

function downloadFile(url, filename) {
    const link = document.createElement("a");

    link.href = url;
    link.download = filename;
    link.target = "_blank";
    link.rel = "noopener";

    document.body.appendChild(link);
    link.click();
    link.remove();
}


/* =================================
   RENDER PLAYLIST
================================= */

function renderTracks(list) {
    const playlist = document.getElementById("playlist");
    const trackCount = document.getElementById("trackCount");
    const emptyMessage = document.getElementById("emptyMessage");

    playlist.innerHTML = "";

    trackCount.textContent =
        `${list.length} track${list.length !== 1 ? "s" : ""}`;

    emptyMessage.style.display =
        list.length === 0 ? "block" : "none";

    list.forEach(file => {

        const audioURL = getAudioURL(file);
        const title = getTrackTitle(file);
        const type = getTrackType(file);

        const card = document.createElement("div");
        card.className = "track-card";

        const top = document.createElement("div");
        top.className = "track-top";

        const name = document.createElement("div");
        name.className = "track-name";
        name.textContent = title;

        const typeLabel = document.createElement("span");
        typeLabel.className = "track-type";
        typeLabel.textContent = type;

        top.appendChild(name);
        top.appendChild(typeLabel);

        const audio = document.createElement("audio");
        audio.controls = true;
        audio.preload = "none";

        const source = document.createElement("source");
        source.src = audioURL;
        source.type = "audio/mpeg";

        audio.appendChild(source);

        const status = document.createElement("div");
        status.className = "status";
        status.textContent = "";

        audio.addEventListener("error", () => {
            status.textContent =
                "Unable to play this file. Check the MP3 URL or file encoding.";
        });

        const footer = document.createElement("div");
        footer.className = "track-footer";

        const size = document.createElement("span");
        size.className = "file-size";
        size.textContent = "Checking file size...";

        const download = document.createElement("a");
        download.className = "download-btn";
        download.href = audioURL;
        download.download = file;
        download.target = "_blank";
        download.rel = "noopener";
        download.textContent = "DOWNLOAD";

        footer.appendChild(size);
        footer.appendChild(download);

        card.appendChild(top);
        card.appendChild(audio);
        card.appendChild(status);
        card.appendChild(footer);

        playlist.appendChild(card);

        getFileSize(audioURL, size);
    });
}


/* =================================
   SEARCH
================================= */

document.getElementById("searchInput")
    .addEventListener("input", function() {

        const search = this.value
            .toLowerCase()
            .trim();

        const filtered = tracks.filter(file =>
            getTrackTitle(file)
                .toLowerCase()
                .includes(search) ||
            file.toLowerCase().includes(search)
        );

        renderTracks(filtered);
    });


/* =================================
   INITIALIZE
================================= */

renderTracks(tracks);

</script>

</body>
</html>
